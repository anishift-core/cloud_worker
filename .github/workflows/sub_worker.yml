name: MegaPlay Subtitle Cloud Worker

on:
  repository_dispatch:
    types: [process_megaplay_sub]

concurrency:
  group: megaplay-sub-${{ github.event.client_payload.episode_path }}
  cancel-in-progress: true

jobs:
  process_megaplay_sub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-megaplay-sub-pip-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            ${{ runner.os }}-megaplay-sub-pip-

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests firebase-admin deep-translator python-dotenv chardet

      - name: Setup Firebase Credentials
        env:
          FIREBASE_JSON: ${{ secrets.FIREBASE_JSON }}
        run: |
          if [ -n "$FIREBASE_JSON" ]; then
            echo "$FIREBASE_JSON" > serviceAccountKey.json
          fi

      - name: Run Cloud Subtitle Worker
        env:
          PYTHONUNBUFFERED: 1
          JOB_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          GITHUB_TOKEN: ${{ secrets.SUB_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ secrets.SUB_GITHUB_REPO || github.repository }}
        run: |
          python sub_worker.py
